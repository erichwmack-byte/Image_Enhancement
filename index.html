<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Enhancer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      min-height: 100vh;
      margin: 0;
    }

    .hero-logo {
      width: 575px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    /* ── Auth Panel ── */
    #auth-panel {
      background: #222;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }

    #auth-panel h2 { margin-top: 0; text-align: center; }

    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid #333;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #888;
      font-size: 15px;
      cursor: pointer;
      margin-top: 0;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .auth-tab.active {
      color: #007bff;
      border-bottom-color: #007bff;
      font-weight: bold;
    }

    .auth-input {
      width: 100%;
      padding: 12px;
      background: #333;
      border: 1px solid #444;
      border-radius: 5px;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .auth-input:focus { outline: none; border-color: #007bff; }

    .auth-error {
      color: #ff4444;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* ── Credit Badge ── */
    #credit-bar {
      position: fixed;
      top: 16px;
      right: 20px;
      display: none;
      align-items: center;
      gap: 12px;
      background: #222;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 1000;
    }

    #credit-count {
      color: #007bff;
      font-weight: bold;
      font-size: 16px;
    }

    .btn-buy {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-buy:hover { background: #1e7e34; }

    .btn-logout {
      background: none;
      color: #888;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-logout:hover { color: #fff; border-color: #666; }

    /* ── Credit Purchase Modal ── */
    #purchase-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #222;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #333;
    }

    .modal-box h3 { margin-top: 0; text-align: center; color: #fff; }

    .pack-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .pack-option:hover { border-color: #007bff; }

    .pack-name { font-weight: bold; font-size: 15px; }
    .pack-credits { color: #007bff; font-size: 13px; margin-top: 3px; }
    .pack-price { font-size: 22px; font-weight: bold; color: #28a745; }

    .btn-close-modal {
      width: 100%;
      background: #333;
      color: #888;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 13px;
    }

    .btn-close-modal:hover { background: #444; color: #fff; }

    /* ── Enhancement Form (existing styles preserved) ── */
    form, #result-container {
      background: #222;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 500px;
    }

    #enhancement-form { display: none; }
    #result-container { display: none; text-align: center; }

    .instructions-box {
      background: #2a2a2a;
      border-left: 4px solid #007bff;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.5;
      color: #ccc;
    }

    .tips-box {
      background: #1a1a1a;
      border: 1px dashed #444;
      padding: 15px;
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.5;
      color: #999;
    }

    ul { margin: 8px 0 0 18px; padding: 0; }
    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #bbb;
    }

    input[type="text"],
    select,
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #333;
      border: 1px solid #444;
      border-radius: 5px;
      color: #fff;
      box-sizing: border-box;
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #007bff;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button[type="submit"]:hover { background: #0056b3; }
    h2 { margin-top: 0; text-align: center; }

    /* ── Loading Overlay ── */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      z-index: 10000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 6px solid #333;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 25px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text { font-size: 22px; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .loading-subtext { font-size: 14px; color: #888; margin-top: 12px; max-width: 300px; line-height: 1.4; }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Analyzing & Enhancing...</div>
  <div class="loading-subtext">Enhancing your renderings into luxury-grade presentation visuals… Each image can take 1-2 mins.</div>
</div>

<!-- Credit Bar (top right when logged in) -->
<div id="credit-bar">
  <span>⚡ <span id="credit-count">0</span> credits</span>
  <button class="btn-buy" onclick="openPurchaseModal()">+ Buy Credits</button>
  <button class="btn-logout" onclick="logout()">Log Out</button>
</div>

<!-- Purchase Modal -->
<div id="purchase-modal">
  <div class="modal-box">
    <h3>Buy Credits</h3>
    <div class="pack-option" onclick="purchasePack('starter')">
      <div>
        <div class="pack-name">Starter Pack</div>
        <div class="pack-credits">40 credits · 40 images or 10 videos</div>
      </div>
      <div class="pack-price">$25</div>
